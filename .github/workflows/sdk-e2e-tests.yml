name: "SDK E2E Tests"

env:
  HUSKY: 0
  PYTHONUTF8: 1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: sdk-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nodejs-sdk:
    env:
      COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
    name: "Node.js SDK Tests"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ./nodejs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          cache: "npm"
          cache-dependency-path: "./nodejs/package-lock.json"
          node-version: 22
      - uses: ./.github/actions/setup-copilot
        id: setup-copilot
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run prettier check
        if: runner.os == 'Linux'
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck SDK
        run: npm run typecheck

      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts

      - name: Warm up PowerShell
        if: runner.os == 'Windows'
        run: pwsh.exe -Command "Write-Host 'PowerShell ready'"

      - name: Run Node.js SDK tests
        if: env.COPILOT_HMAC_KEY != ''
        env:
          COPILOT_CLI_PATH: ${{ steps.setup-copilot.outputs.path }}
        run: npm test
      - name: Skip Node.js live tests without integration secret
        if: env.COPILOT_HMAC_KEY == ''
        run: echo "Skipping live SDK tests because the integration HMAC secret is unavailable."

  go-sdk:
    env:
      COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
    name: "Go SDK Tests"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ./go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-copilot
        id: setup-copilot
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.23"

      - name: Run go fmt
        if: runner.os == 'Linux'
        working-directory: ./go
        run: |
          go fmt ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ go fmt produced changes. Please run 'go fmt ./...' in go"
            git --no-pager diff
            exit 1
          fi
          echo "✅ go fmt produced no changes"

      - name: Install golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          working-directory: ./go
          version: latest
          args: --timeout=5m

      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts

      - name: Warm up PowerShell
        if: runner.os == 'Windows'
        run: pwsh.exe -Command "Write-Host 'PowerShell ready'"

      - name: Run Go SDK tests
        if: env.COPILOT_HMAC_KEY != ''
        env:
          COPILOT_CLI_PATH: ${{ steps.setup-copilot.outputs.path }}
        run: /bin/bash test.sh
      - name: Skip Go live tests without integration secret
        if: env.COPILOT_HMAC_KEY == ''
        run: echo "Skipping live SDK tests because the integration HMAC secret is unavailable."

  python-sdk:
    env:
      COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
    name: "Python SDK Tests"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ./python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-copilot
        id: setup-copilot
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true

      - name: Install Python dev dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ruff lint
        run: uv run ruff check

      - name: Run ty type checking
        run: uv run ty check copilot

      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts

      - name: Warm up PowerShell
        if: runner.os == 'Windows'
        run: pwsh.exe -Command "Write-Host 'PowerShell ready'"

      - name: Run Python SDK tests
        if: env.COPILOT_HMAC_KEY != ''
        env:
          COPILOT_CLI_PATH: ${{ steps.setup-copilot.outputs.path }}
        run: uv run pytest -v -s
      - name: Skip Python live tests without integration secret
        if: env.COPILOT_HMAC_KEY == ''
        run: echo "Skipping live SDK tests because the integration HMAC secret is unavailable."

  dotnet-sdk:
    env:
      COPILOT_HMAC_KEY: ${{ secrets.COPILOT_DEVELOPER_CLI_INTEGRATION_HMAC_KEY }}
    name: ".NET SDK Tests"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ./dotnet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-copilot
        id: setup-copilot
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          cache: "npm"
          cache-dependency-path: "./nodejs/package-lock.json"

      - name: Install Node.js dependencies (for CLI)
        working-directory: ./nodejs
        run: npm ci --ignore-scripts

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Run dotnet format check
        if: runner.os == 'Linux'
        run: |
          dotnet format --verify-no-changes
          if [ $? -ne 0 ]; then
            echo "❌ dotnet format produced changes. Please run 'dotnet format' in dotnet"
            exit 1
          fi
          echo "✅ dotnet format produced no changes"

      - name: Build SDK
        run: dotnet build --no-restore

      - name: Install test harness dependencies
        working-directory: ./test/harness
        run: npm ci --ignore-scripts

      - name: Warm up PowerShell
        if: runner.os == 'Windows'
        run: pwsh.exe -Command "Write-Host 'PowerShell ready'"

      - name: Run .NET SDK tests
        if: env.COPILOT_HMAC_KEY != ''
        run: dotnet test --no-build -v n
      - name: Skip .NET live tests without integration secret
        if: env.COPILOT_HMAC_KEY == ''
        run: echo "Skipping live SDK tests because the integration HMAC secret is unavailable."
